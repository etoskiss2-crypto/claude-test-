name: Cloud coding task (free)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Change to implement"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  coding-task:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gptme
        run: python -m pip install --disable-pip-version-check gptme

      - name: Implement requested change
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TASK: ${{ inputs.task }}
        run: >-
          gptme --no-confirm --tools read,patch,save
          --model openrouter/openrouter/free
          "Do only this scoped task: $TASK. Follow repository instructions. Use read, patch, and save tools only. Do not run shell commands, access credentials, or attempt to push or merge. If the request is unclear, make no changes and explain what is missing."

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/free-agent-${{ github.run_id }}
          delete-branch: true
          title: "Automated coding task"
          body: |
            Changes prepared by the cloud coding workflow.

            Task details and execution log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
